<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pastel Trails</title>
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      const cacheBust = Date.now();
      const localContentScript = document.createElement("script");
      localContentScript.src = "./src/local-content.js?ts=" + cacheBust;
      localContentScript.onload = function () {
        const appScript = document.createElement("script");
        appScript.src = "./src/app.js?ts=" + cacheBust;
        document.body.appendChild(appScript);
      };
      document.body.appendChild(localContentScript);
    </script>
  </body>
</html>
